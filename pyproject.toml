[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pobreza-peru"
version = "2.0.0"
description = "Modelo predictivo de pobreza monetaria en el Perú con microdatos ENAHO 2017-2024"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Aldo Hernán Zanabria Gálvez" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14",
    "pyreadstat>=1.2",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "statsmodels>=0.14",
    "shap>=0.44",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "requests>=2.31",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
tesis = ["pygments>=2.17", "websocket-client>=1.6"]

[project.scripts]
pobreza = "pobreza.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
