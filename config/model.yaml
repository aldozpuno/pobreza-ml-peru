# Modelado: validación temporal, estimadores, calibración y umbral.

objetivo: "pobre"            # 1 = pobre (extremo o no extremo), 0 = no pobre
anio_prueba: 2024

validacion:
  # Ventana expansiva: entrena con todos los años previos al de calibración,
  # calibra con el año siguiente y valida con el subsiguiente.
  primer_anio_validacion: 2020
  excluir_hogares_repetidos_en_prueba: true   # se reportan ambas versiones

pesos:
  # Las tasas poblacionales siempre usan FACTOR07 × MIEPERHO (personas).
  # El entrenamiento puede usar FACTOR07 como peso muestral; se documenta la elección.
  entrenar_con_factor: false
  metricas_ponderadas: true

estimadores:
  principal: xgboost
  comparar: [xgboost, random_forest, probit, logit, knn]
  xgboost:
    n_estimators: 400
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 10
    reg_lambda: 1.0
    tree_method: hist
    eval_metric: aucpr
  random_forest:
    n_estimators: 300
    max_depth: 12
    min_samples_leaf: 20
    n_jobs: -1
  knn:
    n_neighbors: 15
    weights: distance
  logit:
    max_iter: 2000
  probit: {}

calibracion: isotonica       # isotonica | ninguna

umbral:
  # Se elige SIEMPRE en el año de calibración, nunca en el de prueba.
  criterio: f1                # f1 | recall_minimo | tasa_oficial
  recall_minimo: 0.80

explicabilidad:
  muestra_shap: 5000
  periodo_pre: [2017, 2018, 2019]
  periodo_post: [2021, 2022, 2023, 2024]

sensibilidad:
  # Corridas adicionales para responder observaciones del asesor.
  sin_alquiler_imputado: true   # modelo sin P106 (posible vínculo con el gasto)
